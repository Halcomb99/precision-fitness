<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="description" content="Workouts and meal plans built around your goals.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Precision">
<title>Precision Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c; --card:#161a22; --card2:#1d212b; --line:#2a2f3b;
  --text:#f6f4ee; --muted:#9c9a94; --accent:#d99726; --accent-ink:#ffffff;
  --gold-soft:rgba(217,151,38,.12); --good:#4cc38a; --bad:#e5624f; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse at 50% 0%,#212630 0%,#101318 55%,#08090c 100%) fixed}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit}
#app{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 110px calc(18px + env(safe-area-inset-left))}
h1,h2{font-family:"Playfair Display",Georgia,serif;letter-spacing:-.2px}
h1{font-size:38px;line-height:1.08;font-weight:700}
h2{font-size:26px;font-weight:700;margin-bottom:6px;line-height:1.15}
h3{font-family:"DM Sans",sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--accent);margin:28px 0 12px}
p.sub{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.brand svg{width:34px;height:34px}
.brand div{font-family:"Playfair Display",serif;font-weight:600;font-size:19px;line-height:1}
.brand small{display:block;font-family:"DM Sans";font-size:10px;font-weight:700;letter-spacing:2.4px;color:var(--accent);text-transform:uppercase;margin-top:3px}
.hl{color:var(--accent)}
.progress{height:5px;background:var(--line);border-radius:9px;margin-bottom:26px;overflow:hidden}
.progress div{height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;transition:.15s}
.opt:hover{background:var(--card2)}
.opt.on{border-color:var(--accent);background:var(--gold-soft)}
.opt .ic{font-size:26px;width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex-shrink:0}
.opt b{display:block;font-size:16px;margin-bottom:2px}
.opt span{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{flex-direction:column;align-items:flex-start;gap:8px;margin:0;padding:14px}
.grid2 .opt .ic{width:36px;height:36px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:500;transition:.15s}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.chip.like{background:rgba(61,220,132,.14);border-color:var(--good);color:var(--good);font-weight:600}
.chip.dislike{background:rgba(255,92,92,.12);border-color:var(--bad);color:var(--bad);text-decoration:line-through;font-weight:600}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:-6px 0 6px}
.legend b{font-weight:600}
.field{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
.btn{display:block;width:100%;padding:16px;border-radius:6px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-top:22px;transition:.15s;box-shadow:0 6px 20px rgba(217,151,38,.25)}
.btn:hover:not(:disabled){background:#e6a432}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);margin-top:10px;box-shadow:none}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad);box-shadow:none}
.row{display:flex;gap:10px}.row .btn{flex:1}
.back{color:var(--muted);font-size:14px;margin-bottom:14px;display:inline-flex;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat span{text-transform:uppercase;letter-spacing:.8px;font-size:10.5px!important}
.stat b{font-family:"Playfair Display",serif;font-size:26px;color:var(--accent);display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.presets{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.presets button{font-size:12.5px;color:var(--accent);border:1px dashed rgba(217,151,38,.5);border-radius:999px;padding:6px 12px;white-space:nowrap}
/* workout */
.whead{background:linear-gradient(135deg,rgba(217,151,38,.22),rgba(170,111,24,.06));border:1px solid rgba(217,151,38,.3);border-radius:14px;padding:18px;margin-bottom:14px}
.whead .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;background:rgba(255,255,255,.07);padding:5px 10px;border-radius:999px;color:#cfd5de}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;border-left:4px solid var(--line)}
.ex.complete{border-left-color:var(--accent)}
.ex .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex .num{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.ex .name{font-size:17px;font-weight:700;margin:2px 0 6px}
.ex .rx{display:flex;gap:14px;font-size:14px;margin-bottom:8px}
.ex .rx b{color:var(--accent)}
.ex .tip{font-size:13px;color:var(--muted);line-height:1.4}
.swap{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.swap:hover{color:var(--text);border-color:var(--muted)}
.dots{display:flex;gap:8px;margin-top:12px}
.dot{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.dot.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mtag{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
details.card summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.card summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details[open].card summary::after{content:"–"}
details.card ul{margin:12px 0 0 18px;color:#cfd5de;font-size:14px;line-height:1.7}
.finisher{border:1.5px dashed rgba(217,151,38,.5);background:var(--gold-soft)}
.finisher b{color:var(--accent)}
/* meals */
.meal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px}
.meal b{font-size:15.5px;display:block;margin-bottom:8px}
.ing{display:flex;flex-wrap:wrap;gap:5px}
.ing span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--card2);color:#c3cad5}
.ing span.lk{background:rgba(61,220,132,.14);color:var(--good)}
.tipbox{background:var(--gold-soft);border:1px solid rgba(217,151,38,.35);border-radius:14px;padding:14px;font-size:14px;line-height:1.5;margin-bottom:6px}
.fine{font-size:12px;color:var(--muted);margin-top:24px;line-height:1.5}
.hist{display:flex;justify-content:space-between;align-items:center}
.hist small{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:15px}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:none}.kv span{color:var(--muted)}
.onbtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;min-height:38px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;color:var(--text);background:var(--card)}
.iconbtn:hover{border-color:var(--accent)}
.stepn{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:30px}.seg i{flex:1;height:3px;border-radius:3px;background:var(--line);transition:.3s}.seg i.on{background:var(--accent)}
.welcome{text-align:center;padding:48px 0 28px}.welcome svg{width:88px;height:88px;margin-bottom:22px;filter:drop-shadow(0 0 30px rgba(217,151,38,.25))}
.stick{position:sticky;bottom:12px;padding-top:6px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calhead b{font-family:"Playfair Display",serif;font-size:19px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.day{position:relative;aspect-ratio:1;border-radius:10px;font-size:14.5px;font-weight:500;display:grid;place-items:center;transition:.12s}
.day:hover{background:var(--card2)}.day.past{color:#6f6d68}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--text)}
.day.sel{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(217,151,38,.35)}
.day i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%}
i.pl{background:var(--accent)}i.done{background:var(--good)}.day.sel i{background:#fff}
.calkey{display:flex;gap:18px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:12px}.calkey i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.daypanel{margin-top:24px}
.plancard{background:linear-gradient(135deg,rgba(217,151,38,.18),rgba(170,111,24,.04));border:1px solid rgba(217,151,38,.3);border-radius:12px;padding:16px;margin-top:12px}
.ptitle{font-weight:700;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag.gold{background:var(--gold-soft);color:var(--accent);font-weight:600}
.builtfor{font-size:12.5px;color:var(--muted);margin-top:12px}.builtfor b{color:var(--accent);font-weight:600}
.row .btn{margin-top:10px}
button.kv{width:100%;background:none;text-align:left}button.kv em{font-style:normal;color:var(--accent);margin-left:6px}
.viz{display:flex;align-items:center;gap:6px;margin:12px 0 10px;background:#0c0e12;border:1px solid var(--line);border-radius:10px;padding:8px 6px 6px}
.viz .fig{flex:2.3;min-width:0;width:100%;height:auto;display:block}
.viz .side{flex:1;max-width:104px;text-align:center}
.mmap{width:100%;height:auto;display:block}
.mb{fill:#1f242e}.mm{fill:#323846}.mm.p{fill:var(--accent)}.mm.s{fill:var(--accent);opacity:.42}
.mmt{fill:#6f6d68;font-size:6px;font-weight:700;letter-spacing:.6px;text-anchor:middle;font-family:"DM Sans",sans-serif}
.works{font-size:11px;color:var(--muted);line-height:1.35;margin-top:4px}.works b{color:var(--accent);font-weight:600}
.viz .pic{position:relative;flex:2.3;min-width:0;aspect-ratio:1/1}
.viz .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.viz .pic.two img.b{opacity:0;animation:pfswap 3.4s ease-in-out infinite}
@keyframes pfswap{0%,45%{opacity:0}49%,95%{opacity:1}99%,100%{opacity:0}}
.viz .phase{position:absolute;left:6px;top:4px;font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
.viz .phase i{font-style:normal;position:absolute;left:0;top:0;white-space:nowrap}
.viz .pic.two .phase i:first-child{animation:pfswap 3.4s ease-in-out infinite reverse}
.viz .pic.two .phase i:last-child{opacity:0;animation:pfswap 3.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.viz .pic.two img.b,.viz .pic.two .phase i{animation-duration:7s}}
.credit{font-size:12px;color:var(--muted);margin-top:10px}.credit a{color:var(--accent)}
.lasttime{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.lasttime b{color:var(--text);font-weight:600;text-align:right}
.nextup{font-size:13px;color:var(--text);background:var(--card2);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.4}
.nextup.up{background:var(--gold-soft);color:var(--accent);font-weight:600}.nextup.down{color:#e8b4a8}
.sets{margin-top:10px}
.srow{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:6px}
.srow.nw{grid-template-columns:34px 1fr 44px}
.srow.head{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;margin-bottom:4px}
.srow .sn{width:30px;height:30px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.srow input{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;color:var(--text);font:600 16px "DM Sans",sans-serif;padding:8px 10px;text-align:center;outline:none}
.srow input:focus{border-color:var(--accent)}.srow input::placeholder{color:#5d6370;font-weight:500}
.srow .chk{height:38px;border-radius:8px;border:1.5px solid var(--line);color:var(--muted);font-size:16px;font-weight:700}
.srow.on .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.srow.on .sn{background:var(--gold-soft);color:var(--accent)}
.srow.on input{border-color:rgba(217,151,38,.35)}
.prs .kv b em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin:4px 0 12px}
.seg2 button{padding:9px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted)}.seg2 button.on{background:var(--accent);color:#fff}
.handguide .hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.hg div{background:var(--card2);border-radius:8px;padding:10px}.hg b{display:block;font-size:14px}.hg span{font-size:12px;color:var(--muted)}
.mealcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mealcard .mtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.mealcard .mtop b{font-size:16.5px;display:block;margin-top:3px}
.pline{display:grid;grid-template-columns:24px 62px 1fr;gap:6px;align-items:baseline;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.pline .pic2{font-size:15px}.pline .pk{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}.pline .pt{line-height:1.4}.pline i{color:var(--muted);font-style:normal;font-size:12.5px}
.daytot{background:linear-gradient(135deg,rgba(217,151,38,.18),rgba(170,111,24,.04));border:1px solid rgba(217,151,38,.3);border-radius:12px;padding:14px;margin-top:16px}
.tots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}.tots b{font-family:"Playfair Display",serif;font-size:24px;color:var(--accent);display:block}.tots span{font-size:10.5px;color:var(--muted);line-height:1.2;display:block}
.aboutgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.aboutgrid label:last-child{grid-column:1/-1}
.aboutgrid span{display:block;font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.targets{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:4px 0 12px}
.tgrow{display:flex;gap:28px;margin-top:6px}.tgrow b{font-family:"Playfair Display",serif;font-size:28px;color:var(--accent);display:block;line-height:1.1}.tgrow span{font-size:12px;color:var(--muted)}
.targets p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}.targets a{color:var(--accent)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,9,12,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);padding:6px 0;font-weight:500}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============ DATA ============ */
const GOALS=[
 {id:'fat',name:'Lose fat',desc:'Burn fat, get lighter, keep your muscle',ic:'🔥'},
 {id:'lean',name:'Lean & toned',desc:'Defined and tight, not bulky',ic:'✨'},
 {id:'athletic',name:'Athletic',desc:'Fit, quick and capable at anything',ic:'⚡'},
 {id:'muscle',name:'Build muscle',desc:'Bigger, fuller, more size',ic:'💪'},
 {id:'strength',name:'Get strong',desc:'Lift heavier, raw power',ic:'🏋️'}
];
const GOALTXT={
 f:{fat:['Lose fat','Slim down and keep your shape','🔥'],lean:['Lean & toned','Defined and toned, not bulky','✨'],athletic:['Athletic','Fit, quick and capable at anything','⚡'],muscle:['Build & shape','Add muscle and curves, especially glutes and legs','🏋️‍♀️'],strength:['Get strong','Lift heavier and feel powerful','💪']},
 x:{muscle:['Build muscle','Add muscle and shape','💪'],strength:['Get strong','Lift heavier and build real strength','🏋️']}
};
function goalList(){const t=GOALTXT[P().sex==='f'?'f':P().sex==='m'?'':'x']||{};return GOALS.map(g=>t[g.id]?{...g,name:t[g.id][0],desc:t[g.id][1],ic:t[g.id][2]}:g)}
const goalInfo=id=>goalList().find(g=>g.id===id);
const LEVELS=[
 {id:'beginner',name:'Beginner',desc:'New to working out or coming back after a long break',ic:'🌱'},
 {id:'intermediate',name:'Intermediate',desc:'Training fairly consistently for 6+ months',ic:'📈'},
 {id:'advanced',name:'Advanced',desc:'Years of serious, structured training',ic:'🏆'}
];
const LOCATIONS=[
 {id:'gym',name:'Gym',desc:'Full equipment',ic:'🏢',equip:['gym','db','bw','bar','band']},
 {id:'homedb',name:'Home + dumbbells',desc:'Dumbbells and a bench or chair',ic:'🏠',equip:['db','bw']},
 {id:'home',name:'Home, no gear',desc:'Bodyweight only',ic:'🛋️',equip:['bw']},
 {id:'park',name:'Park / outdoors',desc:'Bars, benches, open space',ic:'🌳',equip:['bw','bar']},
 {id:'hotel',name:'Hotel / travel',desc:'Small gym or your room',ic:'🧳',equip:['db','bw','band']}
];

function fgIK(a,b,l1,l2,dir){
  let dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy);
  const mx=(l1+l2)*0.999,mn=Math.abs(l1-l2)+0.01;
  if(d>mx){d=mx}if(d<mn)d=mn;
  const base=Math.atan2(dy,dx),off=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const j=[a[0]+l1*Math.cos(base+dir*off),a[1]+l1*Math.sin(base+dir*off)];
  // end point clamped onto reach
  const ang2=Math.atan2(b[1]-j[1],b[0]-j[0]);
  return[j,[j[0]+l2*Math.cos(ang2),j[1]+l2*Math.sin(ang2)]];
}
const fgL=(p,q,c,w,extra='')=>`<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;

const lerp=(a,b,t)=>a+(b-a)*t;
function lerpPose(A,B,t){
  if(typeof A==='number')return lerp(A,B,t);
  if(Array.isArray(A))return A.map((v,i)=>lerpPose(v,B[i],t));
  if(A&&typeof A==='object'){const o={},D=['eb','kb','fd','bl','one'],Z=['sa','sl'];
    const keys=new Set([...Object.keys(A),...Object.keys(B||{})]);

function figureSVG(name,t){
  const fx=FX[name];if(!fx)return'';
  const pat=PAT[fx[0]],eq=fx[3]||pat.eq;
  const pose=Object.assign({},pat.m?(t<.5?lerpPose(pat.a,pat.m,t*2):lerpPose(pat.m,pat.b,t*2-1)):lerpPose(pat.a,pat.b,t));
  if(pat.one)pose.one=true;
  const body=pat.view==='f'?fgFront(pose,eq):fgSide(pose,eq);
  let extra='';
  if(pat.plate){const f=pose.feet[0],h=pose.hip,dx=f[0]-h[0],dy=f[1]-h[1],d=Math.hypot(dx,dy),nx=-dy/d,ny=dx/d,ox=dx/d*5,oy=dy/d*5;
    extra=fgL([f[0]+ox+nx*22,f[1]+oy+ny*22],[f[0]+ox-nx*22,f[1]+oy-ny*22],FG.C.prop,6)+fgL([f[0]+ox+dx/d*4,f[1]+oy+dy/d*4],[f[0]+dx/d*60,f[1]+dy/d*60],FG.C.prop,3);}
  const floor=pat.nofloor?'':`<line x1="6" y1="141" x2="194" y2="141" stroke="${FG.C.floor}" stroke-width="2"/>`;
  return floor+fgProps(pat.props)+extra+body;
}

/* ---------- Workout engine ---------- */
function prescribe(e){
  const p=P(),R=RX[p.goal||'lean'],lv=p.level||'beginner';
  let sets=e.k==='c'?R.sets:R.isets;
  if(lv==='beginner')sets=Math.max(2,sets-1);
  if(lv==='advanced'&&e.k==='c')sets=Math.min(5,sets+1);
  let reps,rest;
  if(e.k==='t'){reps=(R.hold+(lv==='beginner'?-10:lv==='advanced'?15:0))+'s hold';rest='45s'}
  else if(e.ro){reps=e.ro;rest=R.rest}
  else if(e.eq==='bw'||e.eq==='bar'){reps=R.bw;rest=e.k==='c'?R.rest:R.irest}
  else{reps=e.k==='c'?R.c:R.i;rest=e.k==='c'?R.rest:R.irest}
  return{sets,reps,rest};
}
function poolFor(m,loc){const eq=LOCATIONS.find(l=>l.id===loc).equip;return EX[m].filter(e=>eq.includes(e.eq))}
function generate(muscles,loc,time){
  const count=COUNT[time],order=MUSCLES.map(x=>x[0]).filter(m=>muscles.includes(m)),eqs=LOCATIONS.find(l=>l.id===loc).equip;
  const pools=order.map(m=>{const sc=poolFor(m,loc).map(e=>({e,r:eqs.indexOf(e.eq)+Math.random()*1.6})).sort((a,b)=>a.r-b.r).map(x=>x.e);const cs=sc.filter(e=>e.k==='c'),is=sc.filter(e=>e.k!=='c');return[...cs.slice(0,2),...is,...cs.slice(2)]});
  const list=[];let i=0,guard=0;
  while(list.length<count&&pools.some(p=>p.length)&&guard++<200){const p=pools[i%pools.length];if(p.length)list.push(p.shift());i++}
  const rank=e=>e.m==='abs'?2:e.k==='c'?0:1;
  list.sort((a,b)=>rank(a)-rank(b));
  return{muscles:order,loc,time,items:list.map(e=>({...e,rx:prescribe(e),done:[]})),done:false};
}
function swapEx(idx){
  const w=S.plans[ui.open],it=w.items[idx],used=w.items.map(x=>x.name);
  const opts=poolFor(it.m,w.loc).filter(e=>!used.includes(e.name));
  if(!opts.length){toast('No other options for this spot');return}
  const e=opts[Math.floor(Math.random()*opts.length)];
  w.items[idx]={...e,rx:prescribe(e),done:[]};save();render(true);toast('Swapped in '+e.name);
}
/* ---------- Set logging & progression ---------- */
const kindOf=e=>e.k==='t'?'time':(e.eq==='bw'||e.eq==='bar')?'bw':'wt';

const HEAVY=['Hip Thrust Machine','Barbell Glute Bridge','Barbell Sumo Squat','Sumo Deadlift','Deadlift','Barbell Back Squat','Leg Press','Romanian Deadlift','Goblet Squat','Dumbbell RDL','Bulgarian Split Squat','Dumbbell Walking Lunge'];

function lastSession(name,before){
  const keys=Object.keys(S.plans).filter(k=>k<before).sort().reverse();
  for(const k of keys){const it=S.plans[k].items.find(x=>x.name===name);if(!it)continue;const ds=doneSets(it);if(ds.length)return{date:k,sets:ds}}

}
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};

function suggestion(e,key){
  const last=lastSession(e.name,key),kind=kindOf(e),[lo,hi]=repRange(e);
  if(!last)return{w:'',r:kind==='time'?String(parseInt(e.rx.reps)||30):String(hi),msg:kind==='wt'?'First time logging this. Pick a weight you could lift for 2 more reps than the target.':'First time logging this. Note your reps so we can push you next time.'};
  const ws=last.sets.map(x=>num(x.w)),rs=last.sets.map(x=>num(x.r)),bestW=Math.max(...ws),bestR=Math.max(...rs);
  if(kind==='time'){const t=bestR+5;return{w:'',r:String(t),msg:`Last time you held ${bestR}s. Go for ${t}s today.`,last}}
  if(kind==='bw'){
    if(rs.every(r=>r>=hi))return{w:'',r:String(bestR+1),msg:`You hit ${hi}+ on every set. Slow the lowering to 3 seconds or aim for ${bestR+1}.`,last};
    return{w:'',r:String(bestR+1),msg:`Beat last time: aim for ${bestR+1} reps on your first set.`,last};
  }
  const inc=HEAVY.includes(e.name)?10:5;
  if(rs.every(r=>r>=hi))return{w:String(bestW+inc),r:String(lo),msg:`You hit the top of the range on every set. Move up to ${bestW+inc} lb.`,up:true,last};
  if(rs.filter(r=>r>=lo).length>=Math.ceil(rs.length/2))return{w:String(bestW),r:String(Math.min(hi,Math.max(...rs)+1)),msg:`Stay at ${bestW} lb and add a rep or two per set.`,last};
  const d=r5(bestW*0.92);return{w:String(d),r:String(lo),msg:`Last time was a grind. Drop to ${d} lb and own every rep.`,down:true,last};
}
function fmtSet(x,kind){return kind==='time'?`${x.r}s`:kind==='bw'?`${x.r}`:`${x.w}×${x.r}`}
function bestOf(name,excludeKey){
  let best=null;

    doneSets(it).forEach(x=>{const v=kindOf(it)==='wt'?num(x.w):num(x.r);if(best===null||v>best)best=v})}
  return best;
}

function logSet(i,j,f,v){const it=S.plans[ui.open].items[i];it.log=it.log||[];it.log[j]=it.log[j]||{w:'',r:''};it.log[j][f]=v.replace(/[^\d.]/g,'').slice(0,6);save()}

  const out={};
  SLOTS.forEach(([s])=>{out[s]=ok.filter(m=>m.slot===s).map(m=>({m,score:m.ing.filter(i=>likes.includes(i)).length*2+Math.random()*1.5})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.m)});

/* ---------- Daily targets ---------- */
function targets(){
  const p=P(),w=+p.wLb,h=+p.hIn,a=+p.age,g=p.goal||'lean';
  if(!w)return null;
  const kg=w*0.4536,bmi=h?703*w/(h*h):null;
  let protein=Math.round(Math.min(w,h?25*h*h/703:w)*0.8/5)*5; // 0.8 g per lb (uses a healthy-range weight if BMI is high)
  const out={protein,bmi,cal:null,note:''};
  if(a&&a<18){out.note='Calorie targets are for adults 18+. Focus on regular meals and protein.';return out}
  if(h&&a){
    const cm=h*2.54,base=10*kg+6.25*cm-5*a+(p.sex==='m'?5:p.sex==='f'?-161:-78);
    let tdee=base*1.45,adj={fat:-.2,lean:-.1,athletic:0,muscle:.1,strength:.05}[g];
    if(bmi&&bmi<18.5&&adj<0){adj=0;out.note='Your weight is already on the lighter side, so this is set to maintenance rather than a deficit.'}
    const floor=p.sex==='m'?1500:p.sex==='f'?1200:1350;
    out.cal=Math.max(floor,Math.round(tdee*(1+adj)/10)*10);
  }
  return out;
}

  const p=P(),ex=dietEx(),dis=Object.keys(p.foods).filter(k=>p.foods[k]==='dislike');

  return MEALS.filter(m=>!m.ing.some(i=>ex.includes(i)||dis.includes(i))&&!words.some(w=>(m.name+' '+m.ing.map(i=>FOODNAME[i]).join(' ')).toLowerCase().includes(w)));
}
function pickMeal(slot,exclude){
  const p=P(),likes=Object.keys(p.foods).filter(k=>p.foods[k]==='like');
  const c=mealPool().filter(m=>m.slot===slot&&!(exclude||[]).includes(m.name));
  if(!c.length)return null;
  return c.map(m=>({m,s:m.ing.filter(i=>likes.includes(i)).length*2+Math.random()*2.2})).sort((a,b)=>b.s-a.s)[0].m.name;
}
const mealSig=()=>{const p=P();return JSON.stringify([p.goal,p.size,p.diet,p.foods,p.avoid])};
function buildDay(){
  const g=P().goal||'lean',n=SNACKS[g],used=[];
  const take=sl=>{const x=pickMeal(sl,used);if(x)used.push(x);return x};
  S.mealDay={date:TODAY,sig:mealSig(),b:take('b'),l:take('l'),d:take('d'),s:Array.from({length:n},()=>take('s')).filter(Boolean)};save();
}
function swapMeal(slot,idx){
  const md=S.mealDay,cur=slot==='s'?md.s:[md[slot]],x=pickMeal(slot,[...cur,md.b,md.l,md.d].filter(Boolean));
  if(!x){toast('No other options with your current food choices');return}
  if(slot==='s')md.s[idx]=x;else md[slot]=x;save();render(true);
}
function portions(m,isSnack){
  const p=P(),g=p.goal||'lean',big=p.size==='lg';
  const base=isSnack?{p:big?1.5:1,c:1,v:0,f:0}:{p:big?2:1,v:big?2:1,c:(big?2:1)*CMULT[g],f:(big?2:1)*FMULT[g]};
  const lines=[],tot={p:0,v:0,c:0,f:0};
  let prots=m.ing.filter(i=>PROT.includes(i));const carbs=m.ing.filter(i=>CARB.includes(i)||(i==='beans'&&prots.length>1)),vegs=m.ing.filter(i=>VEG.includes(i));
  if(prots.length>1)prots=prots.filter(i=>i!=='beans');
  const main=prots.find(i=>!['eggs','shake','beans'].includes(i))||prots[0];
  if(prots.length){tot.p=base.p;
    prots=[main,...prots.filter(i=>i!==main)];
    prots.forEach((id,pi)=>{let t;const each=pi===0?base.p:half(base.p/2);
      if(id==='eggs')t=`${Math.max(1,Math.round(each*2.5))} ${pl(Math.round(each*2.5),'egg')}`;
      else if(id==='yogurt'||id==='cottage')t=`${fr(each)} ${pl(each,'cup')} ${FOODNAME[id].toLowerCase()}`;
      else if(id==='shake')t=`${fr(each)} ${pl(each,'scoop')} protein powder`;
      else if(id==='beans')t=`${fr(each)} cupped ${pl(each,'hand')} beans or lentils <i>(~${fr(each/2)} cup)</i>`;
      else t=`${fr(each)} ${pl(each,'palm')} ${FOODNAME[id].toLowerCase()} <i>(~${each*4} oz cooked)</i>`;
      lines.push(['🖐','Protein',t])})}
  if(carbs.length&&base.c){const each=half(base.c/carbs.length);tot.c=base.c;
    carbs.forEach(id=>{let t;
      if(['rice','quinoa','pasta'].includes(id))t=`${fr(each)} cupped ${pl(each,'hand')} ${FOODNAME[id].toLowerCase()} <i>(~${fr(each/2)} cup cooked)</i>`;
      else if(id==='oats')t=`${fr(each)} cupped ${pl(each,'hand')} oats <i>(~${fr(each/2)} cup cooked)</i>`;
      else if(id==='potatoes'||id==='sweetpot')t=`${fr(each)} fist-sized ${FOODNAME[id].toLowerCase().replace(/es$/,'').replace(/s$/,'')}${each>1?'es':''}`;
      else if(id==='bread')t=`${fr(each)} ${pl(each,'slice')} of bread or ${pl(each,'tortilla')}`;
      else if(id==='beans')t=`${fr(each)} cupped ${pl(each,'hand')} beans or lentils <i>(~${fr(each/2)} cup)</i>`;
      else t=`${fr(each)} ${pl(each,'piece')} of fruit or ${pl(each,'cup')} of berries`;
      lines.push(['🤲','Carbs',t])})}
  if(!isSnack){tot.v=base.v;
    lines.push(['✊','Veggies',vegs.length?`${fr(base.v)} ${pl(base.v,'fist')} ${vegs.map(v=>FOODNAME[v].toLowerCase()).join(' & ')} <i>(~${fr(base.v)} ${pl(base.v,'cup')})</i>`:`${fr(base.v)} ${pl(base.v,'fist')} of any veggies or fruit on the side`]);
    tot.f=base.f;const df=P().diet==='dairyfree'||P().diet==='vegan';
    lines.push(['👍','Fats',m.ing.includes('avocado')?`${fr(base.f)} ${pl(base.f,'thumb')} avocado <i>(~¼ avocado each)</i>`:`${fr(base.f)} ${pl(base.f,'thumb')} nuts, nut butter${df?' or olive oil':', olive oil or cheese'} <i>(~1 tbsp each)</i>`]);
  }
  return{lines,tot};
}
function renderMeals(){
  const p=P();if(!p.size)p.size='std';

  const md=S.mealDay,g=goalInfo(p.goal)||goalInfo('lean');
  let h=brand+`<h1>Today's <span class="hl">meals</span></h1><p class="sub" style="margin-top:6px">Built for <b style="color:var(--accent)">${g.name}</b>, from the foods you love.</p>`;

  else h+=`<div class="targets"><p style="margin:0">Add your weight, height and age in <a href="#" onclick="event.preventDefault();edit(1)">Profile → About you</a> to see your daily calorie and protein targets.</p></div>`;
  h+=`<div class="seg2">${SIZES.map(z=>`<button class="${p.size===z.id?'on':''}" onclick="P().size='${z.id}';P().sizeSet=true;save();render(true)">${z.id==='std'?'Standard portions':'Larger portions'}</button>`).join('')}</div>`;
  h+=`<details class="card handguide"><summary>How to measure with your hand</summary><div class="hg"><div><b>🖐 Palm</b><span>Protein · ~4 oz</span></div><div><b>✊ Fist</b><span>Veggies · ~1 cup</span></div><div><b>🤲 Cupped hand</b><span>Carbs · ~½ cup</span></div><div><b>👍 Thumb</b><span>Fats · ~1 tbsp</span></div></div></details>`;
  const tot={p:0,v:0,c:0,f:0};
  const card=(slot,label,name,idx)=>{
    if(!name)return `<h3>${label}</h3><div class="card" style="color:var(--muted);font-size:14px">No matches with your current food choices. Loosen a few in Profile.</div>`;
    const m=MEALS.find(x=>x.name===name),pp=portions(m,slot==='s');for(const k in tot)tot[k]+=pp.tot[k];
    return `<div class="mealcard"><div class="mtop"><div><div class="mtag hl">${label}</div><b>${m.name}</b></div><button class="swap" onclick="swapMeal('${slot}',${idx||0})">⇄ Swap</button></div>`+
      pp.lines.map(([ic,k,t])=>`<div class="pline"><span class="pic2">${ic}</span><span class="pk">${k}</span><span class="pt">${t}</span></div>`).join('')+`</div>`;
  };
  h+=card('b','Breakfast',md.b)+card('l','Lunch',md.l)+card('d','Dinner',md.d)+md.s.map((x,i)=>card('s',md.s.length>1?`Snack ${i+1}`:'Snack',x,i)).join('');
  h+=`<div class="daytot"><div class="mtag">Daily total</div><div class="tots"><div><b>${fr(tot.p)}</b><span>palms protein</span></div><div><b>${fr(tot.v)}</b><span>fists veggies</span></div><div><b>${fr(tot.c)}</b><span>cupped hands carbs</span></div><div><b>${fr(tot.f)}</b><span>thumbs fats</span></div></div></div>`;
  h+=`<div class="tipbox" style="margin-top:12px">🎯 ${FOODTIPS[p.goal||'lean']} Still hungry or not seeing progress after 2–3 weeks? Add or remove one cupped hand of carbs per day and check again.</div>`;
  h+=`<button class="btn ghost" onclick="buildDay();render()">↻ New day plan</button>`;
  h+=`<p class="fine">Hand portions are a simple estimate, not medical or nutrition advice. If you have a health condition, allergies, or specific calorie needs, check with a doctor or registered dietitian.</p>`;
  return h;
}

function renderHistory(){
  const done=Object.entries(S.plans).filter(([,p])=>p.done).sort((a,b)=>b[0].localeCompare(a[0]));
  const wk=keyOf(new Date(Date.now()-6*864e5));
  const thisWeek=done.filter(([k])=>k>=wk&&k<=TODAY).length;
  const upcoming=Object.entries(S.plans).filter(([k,p])=>!p.done&&k>=TODAY).length;
  let h=brand+`<h1>Your <span class="hl">progress</span></h1>`;
  h+=`<div class="stats"><div class="stat"><b>${thisWeek}</b><span>Last 7 days</span></div><div class="stat"><b>${done.length}</b><span>Completed</span></div><div class="stat"><b>${upcoming}</b><span>Planned</span></div></div>`;
  const prs=personalRecords();
  if(prs.length){h+=`<h3>Personal records</h3><div class="card prs">`+prs.slice(0,10).map(p=>`<div class="kv"><span>${p.name}</span><b>${p.label} <em>${parseKey(p.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</em></b></div>`).join('')+`</div>`}
  h+=`<h3>Completed workouts</h3>`;
  if(!done.length)return h+`<div class="empty">Nothing completed yet.<br>Plan a day in Train and hit <b>Complete workout</b> when you're done.</div>`;
  done.slice(0,60).forEach(([k,x])=>{
    const loc=LOCATIONS.find(l=>l.id===x.loc);
    h+=`<button class="card hist" style="width:100%;text-align:left" onclick="ui.tab='train';ui.date='${k}';ui.open='${k}';render()"><div><b>${mnames(x.muscles)}</b><br><small>${loc.ic} ${loc.name} · ${x.items.length} exercises · ${sumSets(x,1)} sets</small></div><small>${parseKey(k).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></button>`;
  });
  return h;
}

function personalRecords(){
  const best={};
  Object.entries(S.plans).forEach(([k,pl])=>pl.items.forEach(it=>{const kind=kindOf(it);doneSets(it).forEach(x=>{
    const v=kind==='wt'?num(x.w):num(x.r);if(!v)return;const b=best[it.name];
    if(!b||v>b.v||(v===b.v&&kind==='wt'&&num(x.r)>b.r))best[it.name]={name:it.name,v,r:num(x.r),date:k,label:kind==='wt'?`${v} lb × ${num(x.r)}`:kind==='time'?`${v}s`:`${v} reps`}})}));
  return Object.values(best).sort((a,b)=>b.date.localeCompare(a.date));
}

["img/mountain-climbers-start.webp","img/mountain-climbers-peak.webp"],"Hollow Body Hold":["img/hollow-body-hold-main.webp"]};
/* Female illustration pack: set FEMALE_PACK=true once img/f/ holds the recolored female files (same file names as img/) */
const FEMALE_PACK=false;
const figSex=()=>{const p=P();return p.sex==='f'?'f':p.sex==='m'?'m':(p.fig||'m')};
function imgsFor(name){const im=IMG[name];if(!im)return null;return (FEMALE_PACK&&figSex()==='f')?im.map(x=>x.replace('img/','img/f/')):im}
const MLABEL={chest:'Chest',delts:'Shoulders',reardelts:'Rear delts',traps:'Traps',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',lats:'Lats',lowerback:'Lower back',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:'Calves'};
function vizFor(name){
  const fx=FX[name];if(!fx)return'';
  const sec=fx[2].length?`<br>Also: ${fx[2].map(k=>MLABEL[k]).join(', ')}`:'';
  const im=imgsFor(name);
  const pic=im?`<div class="pic ${im.length>1?'two':''}" role="img" aria-label="${esc(name)}: start and finish position">${im.map((src,i)=>`<img src="${src}" alt="" ${i?'class="b"':''} loading="lazy" decoding="async">`).join('')}${im.length>1?'<span class="phase"><i>Start</i><i>Finish</i></span>':'<span class="phase hold"><i>Hold</i></span>'}</div>`
    :`<svg class="fig" data-n="${esc(name)}" viewBox="0 -12 200 162">${figureSVG(name,0)}</svg>`;
  return `<div class="viz">${pic}<div class="side">${muscleMap(fx[1],fx[2])}<div class="works"><b>${fx[1].map(k=>MLABEL[k]).join(', ')}</b>${sec}</div></div></div>`;
}
const REDUCED=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
function motionT(ms){
  const p=(ms%3200)/3200,ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  if(REDUCED)return p<.5?0:1;
  if(p<.12)return 0;if(p<.5)return ease((p-.12)/.38);if(p<.62)return 1;return 1-ease((p-.62)/.38);
}
let _last=0;
function animLoop(ms){
  if(ms-_last>33&&!document.hidden){_last=ms;const t=motionT(ms);
    document.querySelectorAll('svg.fig').forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;el.innerHTML=figureSVG(el.dataset.n,t)});}
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();
</script>
